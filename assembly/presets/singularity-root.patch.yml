- insert:
    - id: preset-singularity-root
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: singularity-root
        name: Singularity Root
        description: Root coordination through delegated and independently verified child results.
        order: -1
        plugins:
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.7
                  maxTokens: 32768
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: singularity-agent
            name: '@dangosys/dsh-singularity-next/agent'
            isolate:
              singularityAgentRole: true
            config:
              role: root
