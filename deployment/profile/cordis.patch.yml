# The deployment layer of the singularity-next-web profile.
#
# The bundle patch inserts the `singularity-assembly` host row with no config: a package cannot know
# which control id, domain, or workspace a deployment owns. This layer is applied after every bundle
# layer, and an id-targeted patch replaces the matched row's whole config — so the three keys below
# are the deployment's complete answer, and a key missing here is a missing key, not an inherited one.
#
# @@CHECKOUT@@ / @@DSH_HOME@@ are materialisation tokens: scripts/deploy.mjs substitutes them when it
# writes this profile and refuses to write a file in which one survives.
#
# domainDir is this checkout's domain material, never a copy: the task protocol's verifier program
# lives there, so a profile that pointed somewhere else would run a different criterion.
- id: singularity-assembly
  config:
    controlId: singularity-autonomous-v10
    domainDir: '@@CHECKOUT@@/deployment/domain/sha256'
    workspaceRoot: '@@DSH_HOME@@/workspaces/singularity'

# Sealed Task artifacts and native evidence replace editor-wide Git snapshots.
- id: workspace-changes
  disabled: true

# The deployment's model route, because the base layer mounts `llm-pi-ai` with no providers and
# defaults every agent to `deepseek-official`, for which this machine holds no credential: a profile
# that names no route composes a session in which no model call can happen. The route names an
# environment variable, never a key — `DEEPSEEK_API_KEY` resolves per request through
# `$DSH_HOME/.credentials.yaml`. `agent-default-model` is restated whole because an id-targeted patch
# replaces the matched config, so every key it owns has to be here.
#
# The route is DeepSeek's own Responses endpoint: `api: openai-responses` posts to `<baseURL>/responses`,
# which `https://api.deepseek.com/` serves directly. Model id, capacities and effort levels are the
# provider's own `/models` answer (context 1048576, max output 393216, effort low/high/max), so no
# gateway alias or capacity is restated here.
- id: llm-pi-ai
  config:
    providers:
      deepseek:
        displayName: DeepSeek
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-responses
        baseURL: https://api.deepseek.com/
        retryPolicy:
          mode: normal
          maxRetries: 20
          backoff:
            initialDelayMs: 500
            maxDelayMs: 180000
            jitterRatio: 0.1
        models:
          - id: deepseek-flash
            name: DeepSeek-V4.1-Flash
            contextWindow: 1048576
            maxTokens: 393216
            reasoningEfforts:
              low: low
              high: high
              max: max

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek
    model: deepseek-flash
    reasoningEffort: max

- id: agent-preset-registry
  config:
    default: singularity-root
