# The `singularity-reviewer` agent preset: the read-only review judgement node.
#
# A `@deepseek-ai/dsh-agent-preset` declaration row. dsh 0.2.0 replaced the
# directory-scanning `@deepseek-ai/dsh-agent-presets` roster package with the
# `@deepseek-ai/dsh-agent-preset-registry` plus one declaration row per preset
# (`$DSH_HOME/.agent-presets/` is no longer scanned), so the composition that
# lived in `.dsh/.agent-presets/singularity-reviewer/` is declared here, with
# the same row and the same `preset.yml` metadata.
#
# This composition carries only the persona. The node's whole tool surface is
# decided at spawn time by the capability grant `task_review_agent` passes
# (`REVIEWER_BASELINE`, `keepPresetTools: false`): the grant runs
# `tools.restrict` on the unpublished agent's scoped context, filtering the
# inherited plane down to the read-only list. So whatever the host composition
# offers in addition — bash, write, edit, jobs, subagent, graph_spawn, hitl_*,
# evolution_* — is taken away before the first prompt; mounting tools here
# would only be filtered out again, and a row that mounted a service would
# need an `isolate` realm (see `presets/bb-verify.patch.yml`).
#
# The permission preset is deliberately left at the spawn default. `read-only`
# bundles `approval: ask` (base bundle `cordis.patch.yml`), which would hang an
# unattended reviewer on a human decision; with no policy-gated tool on the
# grant there is nothing to approve, so isolation comes from the tool plane
# alone.
- insert:
    - id: preset-singularity-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: singularity-reviewer
        name: singularity-reviewer
        description: Singularity 评审节点：只读判定六个不可机械观测的维度，以结构化 JSON 交付，不给分数、不改仓库、不起子节点。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是 Singularity 评审节点（review agent）。只读、只判定：不修改任何文件、不起子节点、不调用任何写工具；
                证据不足时如实说不足。结论只以调用方要求的 fenced JSON 交付：
                task_specification / acceptance / decomposition / skill_fit / tool_fit / context_efficiency 六维各给
                adequate|inadequate|unknown，附非空证据引用与理由；证据不足以判定时一律 unknown，绝不给分数。
