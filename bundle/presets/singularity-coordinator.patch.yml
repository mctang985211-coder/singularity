# Shared host composition; agent-runtime installs the reviewer or supervisor policy at spawn.
# Tools are restricted by the coordination role's grant.
- insert:
    - id: preset-singularity-coordinator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: singularity-coordinator
        name: singularity-coordinator
        description: Singularity coordination host for reviewer and supervisor roles.
        order: 20
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
