- insert:
    - id: preset-singularity-improve
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: singularity-improve
        name: Singularity RSI
        description: Evidence-based evolution of Task workflows and their bound methods.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your RSI workspace is {{cwd}}.
              prefix: You are a Singularity method improvement agent powered by the {{model}} model.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.7
                  maxTokens: 32768
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: singularity-agent
            name: '@dangosys/dsh-singularity-next/agent'
            isolate:
              singularityAgentRole: true
            config:
              role: improve
