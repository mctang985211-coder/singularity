name: Offline verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Restricted dependency: the operator provisions an authorized, isolated runner.
    # No pull_request trigger: untrusted code must not run on an internal host.
    runs-on: [self-hosted, singularity-dsh]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:host "$DSH_CONTROL_INSTALLED"
      - run: pnpm verify
